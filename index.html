<script>
/* =========================================================
   ✏️  EDIT ME — names, colors, pictures and the love letter
   ========================================================= */
const CONFIG={
 boy:{name:"Aymane",img:"",
      top:"#f3eee8",legs:"#25252d",hair:"#1d1311",skin:"#f6cba3",color:"#60a5fa"},
 girl:{name:"Koutar",img:"",
      top:"#4a2e27",inner:"#b99b83",legs:"#1f2639",hair:"#21151a",skin:"#f6cba3",color:"#f9a8d4"},
 letter:[
  "My dear Koutar,",
  "",
  "In every world, in every level,",
  "on every path... I would always choose to walk toward you.",
  "",
  "You are my calm, my adventure, and my favorite place to be.",
  "Thank you for being you.",
  "",
  "I love you. ♥",
  "— Aymane"
 ]
};
/* ========================================================= */

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,GY=490;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)*.98;cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
for(const k of ['boy','girl']){const c=CONFIG[k];if(c.img){c.imgEl=new Image();c.imgEl.src=c.img}}

/* ---------- network state ---------- */
const net={role:null,conn:null,peer:null,rin:{l:0,r:0,j:0},send(m){try{if(this.conn&&this.conn.open)this.conn.send(m)}catch(e){}}};

/* ---------- helpers ---------- */
const hs=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const mir=a=>a.map(([x,y,w,h])=>[W-x-w,y,w,h]);
const mirH=a=>a.map(([x,y])=>[W-x,y]);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}
function heart(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s,y-s*.3,x-s*.5,y-s*1.1,x,y-s*.5);ctx.bezierCurveTo(x+s*.5,y-s*1.1,x+s,y-s*.3,x,y+s*.35);ctx.fill()}
function txt(s,x,y,size,col,al='center',font='"Trebuchet MS",sans-serif',w='bold'){ctx.font=`${w} ${size}px ${font}`;ctx.textAlign=al;ctx.fillStyle=col;ctx.fillText(s,x,y)}
function wrap(s,maxW){const out=[];let cur='';for(const w of s.split(' ')){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}out.push(cur);return out}

/* ---------- music & sound (all generated, no files) ---------- */
const mtof=m=>440*2**((m-69)/12);
const Snd={ctx:null,cfg:null,step:0,muted:false,
 start(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
  const C=this.ctx=new(window.AudioContext||window.webkitAudioContext)();
  this.master=C.createGain();this.master.gain.value=this.muted?0:.7;this.master.connect(C.destination);
  this.fx=C.createGain();const d=C.createDelay(1);d.delayTime.value=.42;const fb=C.createGain();fb.gain.value=.38;
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
  this.fx.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(this.master);
  this.nb=C.createBuffer(1,C.sampleRate*.2,C.sampleRate);const dd=this.nb.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
  this.nextT=C.currentTime+.2;setInterval(()=>this.tick(),120);
 },
 setTrack(c){this.cfg=c},
 toggle(){this.muted=!this.muted;if(this.master)this.master.gain.value=this.muted?0:.7},
 note(f,t,dur,type,vol,o={}){
  const C=this.ctx,os=C.createOscillator(),g=C.createGain(),fl=C.createBiquadFilter(),at=o.attack||.01;
  os.type=type;os.frequency.value=f;fl.type='lowpass';fl.frequency.value=o.cut||4000;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(fl);fl.connect(g);g.connect(this.master);
  if(o.send){const s=C.createGain();s.gain.value=o.send;g.connect(s);s.connect(this.fx)}
  os.start(t);os.stop(t+dur+.05);
 },
 kick(t){const C=this.ctx,o=C.createOscillator(),g=C.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.14);g.gain.setValueAtTime(.26,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.25)},
 hat(t,v){const C=this.ctx,s=C.createBufferSource();s.buffer=this.nb;const f=C.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=C.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+.08)},
 tick(){if(!this.ctx||!this.cfg)return;const sp=60/this.cfg.bpm/2;while(this.nextT<this.ctx.currentTime+.4){this.play(this.step,this.nextT,sp);this.nextT+=sp;this.step++}},
 play(s,t,sp){
  const c=this.cfg,bar=Math.floor(s/8)%c.prog.length,pos=s%8,ch=c.prog[bar];
  if(pos===0){ch.forEach(n=>this.note(mtof(c.root+n-12),t,sp*8.5,'triangle',.045,{attack:.45,cut:900,send:.25}));this.note(mtof(c.root+ch[0]-24),t,sp*3,'sine',.2)}
  if(pos===5)this.note(mtof(c.root+ch[0]-24),t,sp*2,'sine',.12);
  const ai=[0,1,2,3,2,1,2,3][pos];
  if([1,0,1,1,0,1,1,1][pos])this.note(mtof(c.root+ch[ai]),t,.8,'triangle',.07,{attack:.005,send:.5,cut:2500});
  if(pos%2===1&&Math.random()<.25)this.note(mtof(c.root+12+c.pent[Math.floor(Math.random()*5)]),t,1.4,'sine',.05,{attack:.02,send:.8});
  if(pos===0||pos===5)this.kick(t);
  if(pos===2||pos===6)this.hat(t,.05);
 },
 sfx(n){
  if(net.role==='host')net.send({t:'e',n});
  if(!this.ctx)return;const t=this.ctx.currentTime;
  if(n==='heart'){this.note(988,t,.25,'sine',.12,{send:.4});this.note(1319,t+.08,.35,'sine',.12,{send:.4})}
  else if(n==='jump')this.note(440,t,.12,'sine',.05);
  else if(n==='plate'){this.note(262,t,.2,'triangle',.15);this.note(392,t+.07,.3,'triangle',.15,{send:.3})}
  else if(n==='gate')[392,523,659,784].forEach((f,i)=>this.note(f,t+i*.09,.9,'triangle',.12,{send:.5}));
  else if(n==='win')[523,659,784,1047,1319].forEach((f,i)=>this.note(f,t+i*.12,1.2,'sine',.13,{send:.6}));
 }};
const MUS=[
 {root:60,bpm:78,pent:[0,2,4,7,9],prog:[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]]},
 {root:57,bpm:72,pent:[0,3,5,7,10],prog:[[0,3,7,10],[8,12,15,19],[3,7,10,14],[10,14,17,21]]},
 {root:62,bpm:84,pent:[0,2,4,7,9],prog:[[0,4,7,11],[7,11,14,17],[9,12,16,19],[5,9,12,16]]},
 {root:64,bpm:66,pent:[0,3,5,7,10],prog:[[0,3,7,10],[8,12,15,19],[3,7,10,14],[10,14,17,21]]},
 {root:60,bpm:70,pent:[0,2,4,7,9],prog:[[5,9,12,16],[0,4,7,11],[9,12,16,19],[7,11,14,17]]}];

/* ---------- levels ---------- */
const GROUND=[0,GY,W,50];
const P1=[[90,430,110,16],[200,372,110,16],[300,314,130,16]],H1=[[200,458],[145,398],[255,340],[335,282]];
const P2=[[190,410,100,16],[320,350,100,16]],H2=[[240,378],[370,318]];
const P3=[[340,410,80,16],[60,400,100,16]],H3=[[380,378],[110,368]];
const P4=[[80,425,100,16],[200,365,90,16],[90,300,90,16],[210,240,100,16]],H4=[[130,393],[245,333],[135,268],[260,208]];
const P5=[[110,420,110,16],[230,360,100,16],[340,300,120,16]],H5=[[165,388],[285,328]];
const LEVELS=[
 {theme:'forest',title:"Chapter 1 — The Forest of Beginnings",
  story:"Two paths through one forest... and somewhere, someone is walking toward you.",
  hint:"Walk to your glowing heart-light  •  collect hearts on the way",music:MUS[0],
  plats:[GROUND,...P1,...mir(P1)],hearts:[...H1,...mirH(H1)],buttons:[],doors:[],
  a:{s:[60,GY],g:[365,314]},k:{s:[900,GY],g:[595,314]}},
 {theme:'city',title:"Chapter 2 — Midnight City",
  story:"The city lights are on, but our doors are locked. Maybe love is opening a door for someone else.",
  hint:"Step on a glowing plate to open the gate for your partner",music:MUS[1],
  plats:[GROUND,...P2,...mir(P2),[430,270,100,16]],hearts:[...H2,...mirH(H2),[480,238]],
  buttons:[{id:'a',x:690,y:GY},{id:'k',x:270,y:GY}],
  doors:[{btn:'a',x:122,w:16},{btn:'k',x:822,w:16}],
  a:{s:[200,GY],g:[60,GY]},k:{s:[760,GY],g:[900,GY]}},
 {theme:'beach',title:"Chapter 3 — Sunset Bay",
  story:"The sea keeps us apart... so let's build a bridge, one plank each.",
  hint:"Each of you builds half of the bridge, then cross and swap sides",music:MUS[2],
  plats:[[0,GY,300,50],[660,GY,300,50],...P3,...mir(P3),[440,340,80,16]],
  hearts:[...H3,...mirH(H3),[480,308],[480,458]],
  buttons:[{id:'a',x:220,y:GY},{id:'k',x:740,y:GY}],
  doors:[{bridge:true,btn:'a',x:300,y:GY,w:180,h:16},{bridge:true,btn:'k',x:480,y:GY,w:180,h:16}],
  a:{s:[60,GY],g:[880,GY]},k:{s:[900,GY],g:[80,GY]}},
 {theme:'snow',title:"Chapter 4 — Aurora Mountain",
  story:"Cold outside, warm inside. Only a heart full of hearts can open the gate.",
  hint:"Collect ALL the hearts to open the Gate of Hearts, then cross to the other side",music:MUS[3],
  plats:[GROUND,...P4,...mir(P4)],hearts:[...H4,...mirH(H4)],buttons:[],
  doors:[{hearts:true,x:472,w:16}],
  a:{s:[50,GY],g:[545,GY]},k:{s:[910,GY],g:[415,GY]}},
 {theme:'garden',title:"Chapter 5 — The Garden of Stars",
  story:"Almost there. The last gate has two locks, and only together can we open it.",
  hint:"Both of you stand on your glowing plates AT THE SAME TIME",music:MUS[4],meet:true,
  plats:[GROUND,...P5,...mir(P5)],hearts:[...H5,...mirH(H5),[400,268],[560,268]],
  buttons:[{id:'p1',x:400,y:300,hold:true},{id:'p2',x:560,y:300,hold:true}],
  doors:[{need:['p1','p2'],x:472,w:16}],
  a:{s:[60,GY],g:[0,0]},k:{s:[900,GY],g:[0,0]}}];
const ENDM={root:60,bpm:64,pent:[0,2,4,7,9],prog:[[5,9,12,16],[0,4,7,11],[9,12,16,19],[7,11,14,17]]};

/* ---------- state ---------- */
const KA={l:'KeyA',r:'KeyD',j:'KeyW'},KK={l:'ArrowLeft',r:'ArrowRight',j:'ArrowUp'};
const keys={};let state='title',li=0,lid=0,L,A,K,t=0,total=0,levelGot=0,introT=0,doneTimer=0,endT=0,fade=0;
let parts=[],amb=[],latched={},pressed={},lit={};
const CL={a:'#60a5fa',k:'#f472b6',p1:'#60a5fa',p2:'#f472b6'};
const STARS=Array.from({length:150},(_,i)=>({x:hs(i)*W,y:hs(i+500)*330,r:hs(i+9)*1.4+.3,p:hs(i+3)*6}));
function mk(cfg,type,k,def){return{cfg,type,keys:k,x:def.s[0]-12,y:def.s[1]-44,w:24,h:44,vx:0,vy:0,dir:type==='boy'?1:-1,ground:false,coy:0,jumped:false,s:def.s,g:def.g}}
function loadLevel(i,forceLid){
 li=i;L=LEVELS[i];lid=forceLid!==undefined?forceLid:lid+1;
 L.h=L.hearts.map(([x,y])=>({x,y,got:false}));
 L.d=L.doors.map(o=>({y:0,h:GY,...o,open:false,solid:!o.bridge,done:false}));
 L.b=L.buttons.map(o=>({...o,on:false}));
 latched={};pressed={};lit={};levelGot=0;
 A=mk(CONFIG.boy,'boy',KA,L.a);K=mk(CONFIG.girl,'girl',KK,L.k);
 introT=0;doneTimer=0;state='play';fade=40;parts=[];
 amb=Array.from({length:40},(_,n)=>({x:hs(n)*W,y:hs(n+99)*GY,sp:.3+hs(n+7),ph:hs(n+3)*6}));
 Snd.setTrack(L.music);
}
function initTitle(){A=mk(CONFIG.boy,'boy',KA,{s:[100,GY],g:[0,0]});K=mk(CONFIG.girl,'girl',KK,{s:[860,GY],g:[0,0]});amb=Array.from({length:40},(_,n)=>({x:hs(n)*W,y:hs(n+99)*GY,sp:.3+hs(n+7),ph:hs(n+3)*6}))}
initTitle();

/* ---------- particles ---------- */
function burst(x,y,n,col,type='dot',spd=3){
 if(net.role==='host')net.send({t:'b',a:[x,y,n,col,type,spd]});
 for(let i=0;i<n;i++){const a=Math.random()*7,s=Math.random()*spd+.5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(type==='heart'?1.5:0),life:60+Math.random()*40,max:100,col,s:type==='heart'?6+Math.random()*5:2+Math.random()*2,type,g:type==='heart'?-.01:.05})}}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 keys[e.code]=true;Snd.start();if(e.repeat)return;
 if(e.code==='KeyM')Snd.toggle();
 if(e.code==='Enter'||(e.code==='Space'&&state!=='play'))action();
 if(e.code==='KeyR'){if(net.role==='guest')net.send({t:'cmd',c:'R'});else doCmd('R')}
 if(e.code==='KeyN'&&net.role!=='guest')doCmd('N');
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
cv.addEventListener('pointerdown',()=>{Snd.start();action()});
function doCmd(c){if(state!=='play')return;if(c==='R'){total-=levelGot;loadLevel(li)}if(c==='N')next()}
function action(){if(state==='ending'&&net.role!=='guest'){total=0;loadLevel(0)}}
function next(){if(li+1>=LEVELS.length)startEnding();else loadLevel(li+1)}
function startEnding(){state='ending';endT=0;parts=[];Snd.setTrack(ENDM);fade=40;A.dir=1;K.dir=-1;A.vx=K.vx=0;A.ground=K.ground=true}
function getIn(p){
 if(net.role==='host'&&p===K)return net.rin;
 if(net.role){return{l:keys.KeyA||keys.ArrowLeft,r:keys.KeyD||keys.ArrowRight,j:keys.KeyW||keys.ArrowUp||keys.Space}}
 return{l:keys[p.keys.l],r:keys[p.keys.r],j:keys[p.keys.j]};
}

/* ---------- online sync ---------- */
function snap(){
 const P=p=>[+p.x.toFixed(1),+p.y.toFixed(1),p.dir,+p.vx.toFixed(1),p.ground?1:0];
 return{t:'s',st:state,li,lid,tot:total,lg:levelGot,it:introT,dt:doneTimer,et:endT,A:P(A),K:P(K),
  h:L&&L.h?L.h.map(h=>h.got?1:0).join(''):'',
  d:L&&L.d?L.d.map(d=>(d.open?1:0)+''+(d.solid?1:0)+(d.done?1:0)):[],
  b:L&&L.b?L.b.map(b=>b.on?1:0).join(''):'',lit,pr:pressed};
}
function tgt(p,a){p.nx=a[0];p.ny=a[1];p.dir=a[2];p.vx=a[3];p.ground=!!a[4];if(p.x===undefined||Math.hypot(p.nx-p.x,p.ny-p.y)>80){p.x=p.nx;p.y=p.ny}}
function applySnap(s){
 if(s.st==='ending'){if(state!=='ending')startEnding()}
 else{if(s.lid!==lid)loadLevel(s.li,s.lid);state=s.st}
 total=s.tot;levelGot=s.lg;introT=s.it;doneTimer=s.dt;endT=s.et;
 tgt(A,s.A);tgt(K,s.K);
 if(L&&L.h){
  L.h.forEach((h,i)=>h.got=s.h[i]==='1');
  L.d.forEach((d,i)=>{const q=s.d[i];if(q){d.open=q[0]==='1';d.solid=q[1]==='1';d.done=q[2]==='1'}});
  L.b.forEach((b,i)=>b.on=s.b[i]==='1');
 }
 lit=s.lit||{};pressed=s.pr||{};
}
let lastIn='';
function sendInput(){const I=getIn(K),s=(I.l?1:0)+''+(I.r?1:0)+(I.j?1:0);if(s!==lastIn||t%30===0){lastIn=s;net.send({t:'in',l:+s[0],r:+s[1],j:+s[2]})}}

/* ---------- update ---------- */
function platRects(){const r=L.plats.map(([x,y,w])=>({x,y,w}));for(const d of L.d)if(d.bridge&&d.solid)r.push({x:d.x,y:d.y,w:d.w});return r}
function computePlates(){
 pressed={};
 for(const b of L.b){let on=false;for(const p of [A,K])if(p.x+p.w>b.x-22&&p.x<b.x+22&&Math.abs(p.y+p.h-b.y)<6)on=true;
  if(on){pressed[b.id]=true;if(!b.hold)latched[b.id]=true}
  if(on&&!b.on)Snd.sfx('plate');b.on=on}
 lit={};for(const b of L.b)lit[b.id]=!!(latched[b.id]||pressed[b.id]);
}
function updateDoors(){
 for(const d of L.d){let open=false;
  if(d.btn)open=!!lit[d.btn];
  if(d.hearts)open=levelGot>=L.h.length;
  if(d.need){if(d.need.every(id=>pressed[id]))d.done=true;open=d.done}
  if(open&&!d.open){Snd.sfx('gate');for(let i=0;i<5;i++)burst(d.x+d.w/2,60+i*90,6,'#ffd6e8','heart')}
  d.open=open;d.solid=d.bridge?open:!open}
}
function stepPlayer(p){
 const I=getIn(p),act=state==='play';
 const ax=act?((I.r?1:0)-(I.l?1:0)):0;
 p.vx=ax*3.6;if(ax)p.dir=ax;
 p.coy=p.ground?7:p.coy-1;
 const jd=act&&I.j;

 const c=p.cfg;ctx.save();ctx.translate(x,y);ctx.scale(p.dir*sc*.85,sc*.85);
 if(c.imgEl&&c.imgEl.naturalWidth){const ih=72,iw=c.imgEl.naturalWidth/c.imgEl.naturalHeight*ih;ctx.drawImage(c.imgEl,-iw/2,-ih,iw,ih);ctx.restore();return}
 const mv=p.ground&&Math.abs(p.vx)>.1,sw=mv?Math.sin(time*.4):0,b=mv?-Math.abs(sw)*2:0,air=!p.ground;
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,1,16,4.5,0,0,7);ctx.fill();
 if(p.type==='boy')drawAymane(c,sw,b,air);else drawKoutar(c,sw,b,air);
 ctx.restore();
}

/* ---------- drawing: screens ---------- */
function drawParts(){for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);if(p.type==='heart')heart(p.x,p.y,p.s,p.col);else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}}ctx.globalAlpha=1}
function drawGame(){
 drawBG(L.theme);drawAmb(L.theme);const T=TH[L.theme];
 L.plats.forEach(r=>drawPlat(r,T));
 L.d.forEach(d=>d.bridge&&drawDoor(d));
 L.b.forEach(drawPlate);
 if(L.meet)drawGoal([480,GY],'#ffd166');else{drawGoal(A.g,CONFIG.boy.color);drawGoal(K.g,CONFIG.girl.color)}
 for(const h of L.h)if(!h.got){const y=h.y+Math.sin(t*.07+h.x)*4;heart(h.x,y,11,'#ff4d6d');ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(h.x-4,y-5,2,0,7);ctx.fill()}
 L.d.forEach(d=>!d.bridge&&drawDoor(d));
 const me=net.role==='host'?A:net.role==='guest'?K:null;
 for(const p of [A,K]){drawChar(p,1,p.x+p.w/2,p.y+p.h,t);ctx.globalAlpha=.95;ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=4;txt(p.cfg.name,p.x+p.w/2,p.y-20,13,p.cfg.color);ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(p===me){const mx=p.x+p.w/2,my=p.y-34+Math.sin(t*.1)*3;ctx.fillStyle=p.cfg.color;ctx.beginPath();ctx.moveTo(mx-6,my-8);ctx.lineTo(mx+6,my-8);ctx.lineTo(mx,my);ctx.fill()}}
 drawParts();
 heart(32,30,10,'#ff4d6d');txt(String(total),50,37,20,'#fff','left');
 txt(`${li+1} / ${LEVELS.length}`,W-20,36,16,'rgba(255,255,255,.7)','right');
 txt('R restart  •  M music',W-16,H-12,12,'rgba(255,255,255,.6)','right');
 txt(L.hint,W/2,H-14,15,'rgba(255,255,255,.85)');
 if(introT<300){
  const a=introT<30?introT/30:introT>260?Math.max(0,1-(introT-260)/40):1;ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.35)';rr(130,50,700,110,18);
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;txt(L.title,W/2,92,28,'#fff');
  ctx.font='italic 19px Georgia,serif';wrap(L.story,640).forEach((l,i)=>txt(l,W/2,125+i*24,19,'#ffe6f2','center','Georgia,serif','italic'));
  ctx.shadowBlur=0;ctx.globalAlpha=1;
 }
 if(state==='done'){
  const a=Math.min(1,doneTimer/20);ctx.globalAlpha=a;ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=10;
  txt(L.meet?"I found you. ♥":"♥ A little closer ♥",W/2,230,L.meet?56:42,'#fff');ctx.shadowBlur=0;ctx.globalAlpha=1;
  const end=L.meet?190:100,fo=Math.max(0,(doneTimer-(end-30))/30);if(fo>0){ctx.fillStyle=`rgba(0,0,0,${fo})`;ctx.fillRect(0,0,W,H)}
 }
}
function drawTitle(){
 drawBG('garden');drawAmb('garden');drawPlat(GROUND,TH.garden);
 drawChar(A,2.1,A.x+12,GY,t);drawChar(K,2.1,K.x+12,GY,t);
 heart(480,GY-70+Math.sin(t*.06)*8,24+Math.sin(t*.1)*3,'#ff4d6d');
 const g=ctx.createLinearGradient(220,0,740,0);g.addColorStop(0,'#7db4ff');g.addColorStop(1,'#ffb3d9');
 ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=14;
 txt(`${CONFIG.boy.name} ♥ ${CONFIG.girl.name}`,W/2,150,68,g);
 txt('~ Until We Meet ~',W/2,200,30,'#ffe6f2','center','Georgia,serif','italic');ctx.shadowBlur=0;
}
function drawEnding(){
 drawBG('garden');drawAmb('garden');drawPlat(GROUND,TH.garden);
 const hopA=Math.max(0,Math.sin(t*.06))*10,hopK=Math.max(0,Math.sin(t*.06+.8))*10;
 heart(480,GY-150+Math.sin(t*.06)*6,28+Math.sin(t*.1)*3,'#ff4d6d');
 drawChar(A,2.1,445,GY-hopA,t);drawChar(K,2.1,515,GY-hopK,t);
 drawParts();
 const a=Math.min(1,endT/60);ctx.globalAlpha=a;ctx.fillStyle='rgba(10,0,30,.55)';rr(110,22,740,330,22);
 let c=Math.floor(Math.max(0,endT-60)/2),y=70;ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=6;
 for(const line of CONFIG.letter){const n=Math.min(line.length,Math.max(0,c));if(n>0)txt(line.slice(0,n),W/2,y,22,'#fff1f7','center','Georgia,serif','italic');c-=line.length+10;y+=29}
 ctx.shadowBlur=0;ctx.globalAlpha=1;
 txt(`♥ ${total} hearts collected ♥   •   ${net.role==='guest'?'Aymane can press ENTER to play again':'press ENTER to play again'}`,W/2,H-16,16,'#fff');
 if(endT<40){ctx.fillStyle=`rgba(0,0,0,${1-endT/40})`;ctx.fillRect(0,0,W,H)}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(state==='title')drawTitle();else if(state==='ending')drawEnding();else if(L)drawGame();
 if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade/40})`;ctx.fillRect(0,0,W,H)}
 if(Snd.muted)txt('🔇',24,H-14,16,'#fff','left');
}

/* ---------- main loop (fixed 60 fps physics) ---------- */
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(.1,(now-last)/1000);last=now;while(acc>=1/60){update();acc-=1/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* =========================================================
   🌍 ONLINE LOBBY (PeerJS / WebRTC)
   ========================================================= */
const $=id=>document.getElementById(id);
const PFX='aymane-koutar-love-';
function hideLobby(){$('lobby').classList.add('hid')}
function showMsg(s,ms){const m=$('msg');m.textContent=s;m.style.display='block';clearTimeout(showMsg.tm);if(ms)showMsg.tm=setTimeout(()=>m.style.display='none',ms)}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}

$('bLocal').onclick=()=>{Snd.start();hideLobby();net.role=null;total=0;loadLevel(0)};
$('bHost').onclick=()=>{Snd.start();$('menu').classList.add('hid');$('hostBox').classList.remove('hid');startHost()};
$('bJoin').onclick=()=>{Snd.start();$('menu').classList.add('hid');$('joinBox').classList.remove('hid');$('codeIn').focus()};
$('bGo').onclick=()=>{Snd.start();joinGame()};
$('codeIn').addEventListener('keydown',e=>{if(e.key==='Enter'){Snd.start();joinGame()}});

function startHost(){
 if(typeof Peer==='undefined'){$('hSt').textContent='Could not load the online library. Check your internet and reload ♥';return}
 const code=genCode(),peer=new Peer(PFX+code);net.peer=peer;net.role='host';
 peer.on('open',()=>{
  $('code').textContent=code;$('hSt').textContent='Waiting for Koutar to join… 💗';
  if(location.protocol.startsWith('http'))$('link').value=location.origin+location.pathname+'?room='+code;else $('linkRow').classList.add('hid');
 });
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();startHost()}else $('hSt').textContent='Error: '+e.type+' — reload the page and try again'});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}});
 peer.on('connection',c=>{
  const go=()=>{
   if(net.conn&&net.conn!==c){try{net.conn.close()}catch(_){}}
   net.conn=c;net.rin={l:0,r:0,j:0};hideLobby();showMsg('Koutar is here! 💗',2500);
   if(state==='title'){total=0;loadLevel(0)}
  };
  if(c.open)go();else c.on('open',go);
  c.on('data',m=>{
   if(m.t==='in')net.rin={l:m.l,r:m.r,j:m.j};
   else if(m.t==='cmd'&&m.c==='R')doCmd('R');
  });
  c.on('close',()=>{if(net.conn===c){net.conn=null;net.rin={l:0,r:0,j:0};showMsg('Koutar disconnected… waiting for her to rejoin 💗')}});
 });
}
function joinGame(){
 if(typeof Peer==='undefined'){$('jSt').textContent='Could not load the online library. Check your internet and reload ♥';return}
 const code=$('codeIn').value.trim().toUpperCase();
 if(!code){$('jSt').textContent='Type the code first ♥';return}
 $('jSt').textContent='Connecting…';$('bGo').disabled=true;
 const peer=new Peer();net.peer=peer;
 const fail=s=>{$('jSt').textContent=s;$('bGo').disabled=false;try{peer.destroy()}catch(_){}net.role=null;net.conn=null};
 peer.on('error',e=>fail(e.type==='peer-unavailable'?'Room not found — check the code 💭':'Error: '+e.type));
 peer.on('open',()=>{
  const c=peer.connect(PFX+code,{reliable:true,serialization:'json'});
  const to=setTimeout(()=>{if(!c.open)fail('Could not connect (timeout). Try again or reload.')},15000);
  c.on('open',()=>{clearTimeout(to);net.role='guest';net.conn=c;hideLobby();showMsg('Connected to Aymane! 💙',2500)});
  c.on('data',m=>{
   if(m.t==='s')applySnap(m);
   else if(m.t==='e')Snd.sfx(m.n);
   else if(m.t==='b')burst(...m.a);
  });
  c.on('close',()=>{if(net.role==='guest')showMsg('Connection lost 💔 — reload the page and join again with the same code')});
 });
}
const roomQ=new URLSearchParams(location.search).get('room');
if(roomQ){$('codeIn').value=roomQ.toUpperCase();$('bJoin').click()}
