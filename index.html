<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aymane & Kaoutar • Game Night</title>
<link rel="stylesheet" href="game.css">
<body class="launcher">
<main id="selection">
  <div class="eyebrow">AYMANE & KAOUTAR / GAME NIGHT</div>
  <h1>Choose your<br><em>adventure.</em></h1>
  <div class="cards">
    <button class="game story" data-game="our-adventure">
      <span class="art"><canvas width="440" height="165" aria-hidden="true"></canvas><span class="emblem">♥</span></span>
      <span class="tag">01 / STORY MODE</span><strong>OUR ADVENTURE ♥</strong><span>Our Original Story</span>
    </button>
    <button class="game chaos" data-game="chaos">
      <span class="art"><canvas width="440" height="165" aria-hidden="true"></canvas><span class="emblem">ϟ</span></span>
      <span class="tag">02 / ARCADE MODE</span><strong>LOVE &amp; CHAOS: CRAZY CHASE!</strong><span>The Ultimate Chaotic Adventure</span>
    </button>
  </div>
</main>
<section id="shell" hidden>
  <button id="back">← Main Selection</button>
  <div id="frame"></div>
</section>
<script src="sprites.js"></script>
<script>
const selection = document.querySelector('#selection');
const shell = document.querySelector('#shell');
const mount = document.querySelector('#frame');
const params = new URLSearchParams(location.search);
document.querySelectorAll('[data-game]').forEach(button => button.onclick = () => {
  const original = button.dataset.game === 'our-adventure';
  const code = params.get(original ? 'room' : 'chaos');
  const frame = document.createElement('iframe');
  frame.title = original ? 'Our Adventure' : 'Love & Chaos';
  frame.src = button.dataset.game + '.html' + (code ? '?room=' + encodeURIComponent(code) : '');
  selection.hidden = true;
  shell.hidden = false;
  mount.replaceChildren(frame);
  frame.onload = () => frame.contentWindow.focus();
});
document.querySelector('#back').onclick = () => {
  mount.replaceChildren();
  shell.hidden = true;
  selection.hidden = false;
};
coupleSprites.ready.then(sprites => {
  document.querySelectorAll('.art canvas').forEach((canvas, mode) => {
    const ctx = canvas.getContext('2d');
    for (let i = 0; i < 20; i++) {
      ctx.fillStyle = i % 2 ? '#ffffff64' : mode ? '#ffe375' : '#ffafca';
      ctx.font = (10 + i % 4 * 3) + 'px system-ui';
      ctx.fillText(i % 3 ? '✦' : '♥', (i * 73 + 21) % 430, 17 + i * 41 % 135);
    }
    sprites.forEach((sprite, i) => {
      if (!sprite) return;
      const image = sprite[1], w = image.width * .84;
      ctx.save();
      ctx.translate(i ? 302 : 133, 95);
      ctx.rotate(mode ? (i ? .17 : -.19) : 0);
      ctx.drawImage(image, -w / 2, -63, w, 126);
      ctx.restore();
    });
  });
});
</script>
</body>
</html>
