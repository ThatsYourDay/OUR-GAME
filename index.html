/* ---------- Sound ---------- */
const mf=m=>440*Math.pow(2,(m-69)/12);
const PROG=[
 [[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],
 [[48,52,55,59],[45,48,52,55],[53,57,60,64],[55,59,62,65]],
 [[50,53,57,60],[55,58,62,65],[51,55,58,62],[58,62,65,69]]
];
const Snd={ac:null,m:false,prog:0,
 init(){
  if(this.ac){this.ac.resume();return}
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  const ac=this.ac=new A();
  this.mg=ac.createGain();this.mg.gain.value=this.m?0:.8;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  const dl=ac.createDelay();dl.delayTime.value=.38;
  const fb=ac.createGain();fb.gain.value=.35;dl.connect(fb);fb.connect(dl);
  this.bus=ac.createGain();this.bus.connect(lp);this.bus.connect(dl);dl.connect(lp);
  lp.connect(this.mg);this.mg.connect(ac.destination);
  this.sfx=ac.createGain();this.sfx.connect(this.mg);
  this.next=ac.currentTime+.1;this.step=0;
  setInterval(()=>this.sched(),100);
 },
 n(f,t,d,type,v,dest,att){
  const ac=this.ac,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;att=att||.01;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||this.bus);o.start(t);o.stop(t+d+.05);
 },
 sched(){
  if(!this.ac)return;
  while(this.next<this.ac.currentTime+.4){
   const P=PROG[this.prog%3],ch=P[Math.floor(this.step/8)%4],t=this.next;
   if(this.step%8===0){
    ch.forEach((m,i)=>this.n(mf(m),t+i*.03,3.6,'triangle',.05,this.bus,.6));
    this.n(mf(ch[0]-12),t,2.2,'sine',.12,this.bus,.05);
   }
   if(this.step%2===0||Math.random()<.3){
    if(Math.random()<.75){
     const m=ch[Math.floor(Math.random()*4)]+12+(Math.random()<.4?12:0);
     this.n(mf(m),t,1.4,'sine',.07,this.bus,.01);
    }
   }
   this.next+=.46;this.step++;
  }
 },
 toggle(){this.m=!this.m;if(this.mg)this.mg.gain.value=this.m?0:.8},
 play(k){
  if(!this.ac)return;const t=this.ac.currentTime,d=this.sfx;
  if(k==='jump'){this.n(420,t,.12,'sine',.12,d);this.n(560,t+.05,.1,'sine',.1,d)}
  else if(k==='heart'){this.n(880,t,.15,'triangle',.15,d);this.n(1320,t+.08,.25,'triangle',.15,d)}
  else if(k==='plate'){this.n(200,t,.12,'square',.05,d)}
  else if(k==='door'){this.n(330,t,.2,'triangle',.12,d);this.n(495,t+.1,.3,'triangle',.12,d)}
  else if(k==='resp'){this.n(220,t,.3,'sawtooth',.04,d)}
  else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>this.n(f,t+i*.12,.6,'triangle',.14,d))}
  else if(k==='party'){[523,659,784,1047,784,1047,1319,1568,1319,1568,2093].forEach((f,i)=>{this.n(f,t+i*.16,.7,'triangle',.14,d);this.n(f/2,t+i*.16,.7,'sine',.08,d)})}
 },
 blip(w){
  if(!this.ac)return;const t=this.ac.currentTime;
  const f=w==='a'?150+Math.random()*50:w==='k'?360+Math.random()*80:260+Math.random()*20;
  this.n(f,t,.06,'square',.035,this.sfx,.004);
 }
};

function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const BGC={};
function getBG(k){return BGC[k]||(BGC[k]=makeBG(k))}
function makeBG(k){
 const T=TH[k],c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d'),r=rnd(k.length*7+3);
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,T.sky[0]);g.addColorStop(1,T.sky[1]);
 x.fillStyle=g;x.fillRect(0,0,W,H);
 if(T.stars){
  x.fillStyle='#fff';
  for(let i=0;i<80;i++){x.globalAlpha=r()*.7+.2;x.fillRect(r()*W,r()*300,1.6,1.6)}
  x.globalAlpha=1;
  if(k!=='space'){x.fillStyle='rgba(255,250,220,.9)';x.shadowColor='#fff6c0';x.shadowBlur=30;x.beginPath();x.arc(800,90,26,0,7);x.fill();x.shadowBlur=0}
 }
 if(T.city){
  let bx=0;
  while(bx<W){
   const w=40+r()*50,h=120+r()*170;
   x.fillStyle=T.far;x.fillRect(bx,480-h,w,h+60);
   x.fillStyle='rgba(255,220,120,.5)';
   for(let wy=480-h+10;wy<470;wy+=18)for(let wx=bx+6;wx<bx+w-8;wx+=14)if(r()<.35)x.fillRect(wx,wy,6,8);
   bx+=w+4;
  }
 }else{
  x.fillStyle=T.far;x.beginPath();x.moveTo(0,H);
  for(let i=0;i<=W;i+=20)x.lineTo(i,400-Math.sin(i*.008+1)*40-Math.sin(i*.021)*18);
  x.lineTo(W,H);x.fill();
 }
 return c;
}

/* ---------- Save ---------- */

/* ---------- State ---------- */

G.P=[mk([300,346]),mk([620,346])];G.P[1].f=-1;
const ev=k=>{Snd.play(k);if(G.mode==='host')G.ev.push(k)};
const hit=(p,s)=>p.x<s.x+s.w&&p.x+p.w>s.x&&p.y<s.y+s.h&&p.y+p.h>s.y;

function loadLevel(i,remote){
 const L=LV[i];G.lv=i;G.L=L;
 G.pl=L.p.map(p=>Object.assign({on:0,lat:0,was:0},p));
 G.dr=L.d.map(d=>Object.assign({open:0,lat:0},d));
 const cols={a:CONFIG.boy.color,k:CONFIG.girl.color,any:'#fde68a'};
 G.dr.forEach(d=>{
  if(d.hearts)d.col='#fb7185';
  else if(d.req.length>1)d.col='#fde68a';
  else d.col=cols[G.pl.find(q=>q.id===d.req[0]).who];
 });
 G.pl.forEach(q=>q.col=cols[q.who]);
 G.hr=L.h.map(h=>({x:h[0],y:h[1],got:0}));
 G.hc=0;G.P=[mk(L.a),mk(L.k)];G.P[1].f=-1;
 G.pt=0;G.ph='play';G.bg=getBG(L.th);G.startTot=G.tot;
 Snd.prog=i;initPA();
 if(!remote){SAVE.max=Math.max(SAVE.max,i);SAVE.tots[i]=G.tot;save()}
}
function startGame(ch){
 document.getElementById('menu').style.display='none';
 G.tot=ch?(SAVE.tots[ch]||0):0;
 if(ch===0){loadLevel(0);G.ph='intro';G.ii=0;G.pt=0;iaI=-1}
 else loadLevel(ch);
}
function win(){
 const [b,g]=G.P;
 G.ph='found';G.pt=0;ev('win');
 b.f=b.x<g.x?1:-1;g.f=-b.f;
 SAVE.done[G.lv]=1;
 if(G.lv+1<LV.length){SAVE.max=Math.max(SAVE.max,G.lv+1);SAVE.tots[G.lv+1]=G.tot}
 save();
}
function nextLevel(){
 if(G.lv+1<LV.length)loadLevel(G.lv+1);
 else{G.ph='end';G.pt=0;FW=[];CF=[];ev('party')}
}
function nextLine(){
 G.ii++;G.pt=0;
 if(G.ii>=CONFIG.intro.length){loadLevel(0)}
}
function doEnter(){
 if(G.ph==='intro'){const L=CONFIG.intro[G.ii];if(G.pt<L.t.length*2)G.pt=L.t.length*2;else nextLine()}
 else if(G.ph==='found'&&G.pt>30)nextLevel();
 else if(G.ph==='end'&&G.pt>600)startGame(0);
}
function restart(){G.tot=G.startTot;loadLevel(G.lv)}
function jump(d){
 if(G.ph!=='play'&&G.ph!=='found')return;
 const t=G.lv+d;if(t<0||t>=LV.length)return;
 G.tot=SAVE.tots[t]||0;loadLevel(t);
}

/* ---------- Simulation ---------- */
function upd(p,i,sol,doors){
 const dir=(i.r?1:0)-(i.l?1:0);
 p.vx+=(dir*3.4-p.vx)*.4;if(dir)p.f=dir;
 if(i.j&&!p.jp)p.jb=7;p.jp=i.j?1:0;if(p.jb>0)p.jb--;
 p.co=p.og?7:p.co-1;
 if(p.jb>0&&p.co>0){p.vy=-11.8;p.jb=0;p.co=0;ev('jump')}
 if(!i.j&&p.vy<-5)p.vy*=.85;
 p.vy=Math.min(14,p.vy+.58);
 for(const d of doors){
  if(!hit(p,d))continue;
  if(d.inv)p.y=d.y-p.h;
  else{p.x=p.sx;p.y=p.sy;p.vx=p.vy=0;ev('resp')}
 }
 p.x+=p.vx;
 for(const s of sol)if(hit(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0}
 p.y+=p.vy;p.og=false;
 for(const s of sol)if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.og=true}else if(p.vy<0)p.y=s.y+s.h;p.vy=0}
 if(p.y<0){p.y=0;if(p.vy<0)p.vy=0}
 if(p.x<0)p.x=0;if(p.x>W-p.w)p.x=W-p.w;
 if(p.y>640){p.x=p.sx;p.y=p.sy;p.vx=p.vy=0;ev('resp')}
 if(p.og)p.an+=Math.abs(p.vx)*.12;
}
function sim(){
 const [b,g]=G.P;let ib,ig;
 if(G.mode==='local'){
  ib={l:K.KeyA,r:K.KeyD,j:K.KeyW};ig={l:K.ArrowLeft,r:K.ArrowRight,j:K.ArrowUp};
 }else{
  ib={l:K.KeyA||K.ArrowLeft,r:K.KeyD||K.ArrowRight,j:K.KeyW||K.ArrowUp||K.Space};ig=G.rin;
 }
 for(const q of G.pl){
  let cur=0;
  G.P.forEach((p,i)=>{
   if((q.who==='any'||(q.who==='a'&&i===0)||(q.who==='k'&&i===1))&&p.og&&Math.abs(p.y+p.h-q.y)<3){
    const cx=p.x+13;if(cx>q.x&&cx<q.x+q.w)cur=1;
   }
  });
  if(cur&&q.latch)q.lat=1;
  q.on=(cur||q.lat)?1:0;
  if(q.on&&!q.was)ev('plate');
  q.was=q.on;
 }
 const pm={};G.pl.forEach(q=>pm[q.id]=q);
 for(const d of G.dr){
  let o=d.hearts?(G.hc>=G.hr.length):d.req.every(id=>pm[id].on);
  if(d.latch&&o)d.lat=1;if(d.lat)o=1;o=o?1:0;
  if(o!==d.open&&G.pt>2)ev('door');
  d.open=o;
 }
 const sol=G.L.s.concat(G.dr.filter(d=>d.inv?d.open:!d.open));
 const solidDoors=G.dr.filter(d=>d.inv?d.open:!d.open);
 upd(b,ib,sol,solidDoors);upd(g,ig,sol,solidDoors);
 for(const h of G.hr)if(!h.got)G.P.forEach(p=>{
  if(!h.got&&Math.abs(p.x+13-h.x)<22&&Math.abs(p.y+22-h.y)<30){h.got=1;G.hc++;G.tot++;ev('heart')}
 });
 if(Math.abs(b.x-g.x)<38&&Math.abs(b.y-g.y)<36)win();
}

/* ---------- Network ---------- */
const $=id=>document.getElementById(id);
const status=h=>$('status').innerHTML=h;
function snap(){
 const r=v=>Math.round(v*10)/10;
 return{ph:G.ph,lv:G.lv,pt:G.pt,ii:G.ii,tot:G.tot,hc:G.hc,
  p:G.P.map(p=>[r(p.x),r(p.y),p.f,Math.round(p.an*100)/100,p.og?1:0,r(p.vx)]),
  pl:G.pl.map(x=>x.on?1:0),dr:G.dr.map(x=>x.open?1:0),hr:G.hr.map(x=>x.got?1:0),ev:G.ev.splice(0)};
}
function apply(s){
 if(s.lv!==G.lv)loadLevel(s.lv,true);
 G.ph=s.ph;G.pt=s.pt;G.ii=s.ii;G.tot=s.tot;G.hc=s.hc;
 s.p.forEach((a,i)=>{const p=G.P[i];p.x=a[0];p.y=a[1];p.f=a[2];p.an=a[3];p.og=a[4];p.vx=a[5]});
 s.pl.forEach((v,i)=>{if(G.pl[i])G.pl[i].on=v});
 s.dr.forEach((v,i)=>{if(G.dr[i])G.dr[i].open=v});
 s.hr.forEach((v,i)=>{if(G.hr[i])G.hr[i].got=v});
 s.ev.forEach(e=>Snd.play(e));
}
function onData(m){
 if(G.mode==='host'){
  if(m.in)G.rin={l:m.in[0],r:m.in[1],j:m.in[2]};
  if(m.cmd==='r'&&G.ph==='play')restart();
  if(m.cmd==='enter')doEnter();
 }else if(G.mode==='guest'&&m.ph)apply(m);
}
function lost(){
 G.mode='local';conn=null;G.ph='menu';
 $('menu').style.display='flex';
 status('⚠️ Connection lost. Create or join a room again.');
}
function hostRoom(){
 if(typeof Peer==='undefined'){status('Online mode needs internet (PeerJS failed to load).');return}
 Snd.init();
 const al='ABCDEFGHJKLMNPQRSTUVWXYZ';let code='';
 for(let i=0;i<5;i++)code+=al[Math.floor(Math.random()*al.length)];
 status('Creating room…');
 peer=new Peer(PREF+code);
 peer.on('open',()=>{
  const link=location.href.split('?')[0].split('#')[0]+'?room='+code;
  status('Room code: <b style="font-size:22px">'+code+'</b><br>Send Koutar this link:<br>'+link+'<br>Waiting for Koutar…');
 });
 peer.on('connection',c=>{
  conn=c;
  c.on('open',()=>{G.mode='host';G.rin={l:0,r:0,j:0};startGame(+$('chSel').value)});
  c.on('data',onData);c.on('close',lost);
 });
 peer.on('error',e=>{if(e.type==='unavailable-id')hostRoom();else status('Error: '+e.type)});
}
function joinRoom(){
 const code=$('code').value.trim().toUpperCase();
 if(code.length<3){status('Type the room code first.');return}
 if(typeof Peer==='undefined'){status('Online mode needs internet (PeerJS failed to load).');return}
 Snd.init();status('Connecting…');
 peer=new Peer();
 peer.on('open',()=>{
  conn=peer.connect(PREF+code,{reliable:true,serialization:'json'});
  conn.on('open',()=>{G.mode='guest';G.ph='wait';$('menu').style.display='none'});
  conn.on('data',onData);conn.on('close',lost);
 });
 peer.on('error',e=>status('Error: '+e.type+(e.type==='peer-unavailable'?' — wrong code or Aymane is not ready yet.':'')));
}

/* ---------- Particles ---------- */
let PA=[],FW=[];
function initPA(){PA=[];for(let i=0;i<40;i++)PA.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*.8+.4,ph:Math.random()*6.28})}
initPA();
function drawPA(t){
 if(!t||t==='none')return;
 for(const p of PA){
  if(t==='leaf'||t==='petal'){
   p.y+=.6*p.s;p.x+=Math.sin(fr*.02+p.ph)*.6+.3;
   ctx.fillStyle=t==='leaf'?'#c9e66a':'#ffb7cf';
   ctx.beginPath();ctx.ellipse(p.x,p.y,5*p.s,2.5*p.s,fr*.03+p.ph,0,7);ctx.fill();
  }else if(t==='snow'){
   p.y+=.8*p.s;p.x+=Math.sin(p.ph+fr*.01)*.4;
   ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(p.x,p.y,2*p.s,0,7);ctx.fill();
  }else if(t==='rain'){
   p.y+=9*p.s;p.x-=1.5;
   ctx.strokeStyle='rgba(200,220,255,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+2,p.y-12);ctx.stroke();
  }else if(t==='star'){
   p.y-=.1;ctx.fillStyle='rgba(255,255,255,'+(.4+.5*Math.sin(fr*.05+p.ph))+')';
   ctx.fillRect(p.x-1,p.y-4,2,8);ctx.fillRect(p.x-4,p.y-1,8,2);
  }else if(t==='lantern'){
   p.y-=.5*p.s;p.x+=Math.sin(fr*.02+p.ph)*.3;
   ctx.shadowColor='#ffb347';ctx.shadowBlur=14;ctx.fillStyle='rgba(255,170,70,.85)';
   ctx.beginPath();ctx.roundRect(p.x-5,p.y-7,10,14,3);ctx.fill();ctx.shadowBlur=0;
  }else if(t==='cloud'){
   p.x+=.2*p.s;ctx.fillStyle='rgba(255,255,255,.5)';
   ctx.beginPath();ctx.ellipse(p.x,(p.y%260)+30,34*p.s,12*p.s,0,0,7);ctx.fill();
  }
  if(p.y>H+10)p.y=-10;if(p.y<-20)p.y=H+10;if(p.x>W+40)p.x=-40;if(p.x<-20)p.x=W+20;
 }
}

/* ---------- Drawing helpers ---------- */
function heart(x,y,s){
 ctx.beginPath();ctx.moveTo(x,y+s*.4);
 ctx.bezierCurveTo(x-s,y-s*.2,x-s*.5,y-s*.9,x,y-s*.4);
 ctx.bezierCurveTo(x+s*.5,y-s*.9,x+s,y-s*.2,x,y+s*.4);ctx.fill();
}
const imgs={};
function getImg(s){
 if(!s)return null;
 if(!imgs[s]){const i=new Image();i.src=s;imgs[s]=i}
 return imgs[s].complete&&imgs[s].naturalWidth?imgs[s]:null;
}
function drawChar(who,cx,fy,f,an,mouth,sc){
 const C=who?CONFIG.girl:CONFIG.boy,sp=SPR[who?1:0];
 ctx.save();ctx.translate(cx,fy);ctx.scale((sc||1)*(f<0?-1:1),sc||1);
 const sw=Math.sin(an)*4,bob=Math.abs(Math.sin(an))*1.5;
 if(sp){const h=SIZE,im=(sc||1)>1.3?sp[1]:sp[0],w=h*im.width/im.height;ctx.rotate(Math.sin(an)*.07);ctx.drawImage(im,-w/2,-h-bob,w,h);ctx.restore();return}
 ctx.translate(0,-bob);
 const E=(x,y,rx,ry,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()};
 const B=(x,y,w,h,col,r)=>{ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r||2);ctx.fill()};
 // back parts
 if(!who)B(-18,-29,11,18,'#18181d',4);
 else{B(-15,-42,30,30,C.hair,10);E(-9,-13,6,5,C.hair);E(9,-13,6,5,C.hair)}
 // legs + shoes
 B(-8+sw*.5,-11,6.5,11,C.legs,2);B(2-sw*.5,-11,6.5,11,C.legs,2);
 if(who){B(-10+sw*.5,-12,9,12,C.legs,2);B(1-sw*.5,-12,9,12,C.legs,2)}
 E(-4.5+sw*.5,-1.5,5.5,2.8,'#fff');E(5.5-sw*.5,-1.5,5.5,2.8,'#fff');
 // body
 if(!who){
  B(-9,-28,18,18,C.top,5);
  B(-13,-27,6,8,C.top,3);B(7,-27,6,8,C.top,3);
  B(-13,-20,5,7,C.skin,2);B(8,-20,5,7,C.skin,2);B(8,-17,5,2.5,'#444',1);
 }else{
  B(-10,-28,20,18,C.top,5);B(-3,-28,6,15,C.inner,2);
  B(-10,-14,20,2.5,'#2a1a14',1);E(0,-12.8,2,1.4,'#d4af37');
  B(-14,-27,6,12,C.top,3);B(8,-27,6,12,C.top,3);
  E(-11,-14,2.6,2.6,C.skin);E(11,-14,2.6,2.6,C.skin);
  B(8,-17,8,7,'#111',2);
 }
 // head
 E(0,-34,14,13.5,C.skin);
 ctx.fillStyle=C.hair;
 ctx.beginPath();ctx.arc(0,-35,14.5,Math.PI,0);ctx.fill();
 if(!who){
  for(let i=0;i<=6;i++){const a=Math.PI+i*Math.PI/6;E(Math.cos(a)*13.5,-35+Math.sin(a)*13.5,4.6,4.6,C.hair)}
  E(-5,-49,5,4,C.hair);E(3,-50,5.5,4.5,C.hair);E(9,-47,4.5,4,C.hair);
 }else{
  B(-15,-38,5,22,C.hair,3);B(10,-38,5,22,C.hair,3);
  ctx.fillStyle=C.hair;
  ctx.beginPath();ctx.moveTo(0,-48);ctx.quadraticCurveTo(-14,-44,-14,-30);ctx.lineTo(-10,-30);ctx.quadraticCurveTo(-8,-40,0,-43);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,-48);ctx.quadraticCurveTo(14,-44,14,-30);ctx.lineTo(10,-30);ctx.quadraticCurveTo(8,-40,0,-43);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-48);ctx.lineTo(0,-43);ctx.stroke();
  E(-13.5,-27,1.7,1.7,'#e5e9f0');E(13.5,-27,1.7,1.7,'#e5e9f0');
 }
 // face
 E(-3,-33,1.8,2.4,'#222');E(7,-33,1.8,2.4,'#222');
 E(-2.6,-33.8,.6,.6,'#fff');E(7.4,-33.8,.6,.6,'#fff');
 if(!who){
  ctx.strokeStyle='#222';ctx.lineWidth=1.5;
  ctx.strokeRect(-7,-37,8,6.5);ctx.strokeRect(3,-37,8,6.5);
  ctx.beginPath();ctx.moveTo(1,-34);ctx.lineTo(3,-34);ctx.stroke();
 }else{
  ctx.strokeStyle='#111';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-5,-34.5);ctx.lineTo(-6.5,-36);ctx.moveTo(9,-34.5);ctx.lineTo(10.5,-36);ctx.stroke();
 }
 ctx.globalAlpha=.35;E(-9,-28.5,3,2,'#ff7a90');E(11,-28.5,3,2,'#ff7a90');ctx.globalAlpha=1;
 if(mouth)E(2,-27.5,2.3,2.2,'#8b2d3a');
 else{ctx.strokeStyle='#8b2d3a';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(2,-29,2.4,.1,Math.PI-.1);ctx.stroke()}
 if(!who)E(2,-23.5,3.3,2.6,C.hair);
 ctx.restore();
}
function wrap(t,mw){
 const ws=t.split(' '),out=[];let cur='';
 for(const w of ws){const x=cur?cur+' '+w:w;if(ctx.measureText(x).width>mw&&cur){out.push(cur);cur=w}else cur=x}
 if(cur)out.push(cur);return out;
}
function groundDraw(T,y){
 ctx.fillStyle=T.body;ctx.fillRect(0,y,W,H-y);ctx.fillStyle=T.top;ctx.fillRect(0,y,W,8);
}

 for(let i=0;i<6;i++)heart(480+Math.sin(pt*.03+i*2)*40,380-((pt*.7+i*60)%200),9+i%3*3);
 // confetti
 const step=fr!==CFfr;CFfr=fr;
 if(step)for(let i=0;i<(party?5:1);i++)CF.push({x:Math.random()*W,y:-10,vx:Math.random()*2-1,vy:2+Math.random()*3,r:Math.random()*6,vr:Math.random()*.3-.15,s:6+Math.random()*7,c:'hsl('+Math.floor(Math.random()*360)+',90%,65%)'});
 CF=CF.filter(p=>p.y<H+20);
 for(const p of CF){

 }
 // ===== Arabic congratulations =====
 if(party){

  ctx.direction='rtl';ctx.textAlign='center';ctx.shadowColor='#f9a8d4';ctx.shadowBlur=26;
  ctx.save();ctx.translate(W/2,135);const bz=sc*(1+Math.sin(pt*.12)*.03);ctx.scale(bz,bz);
  ctx.fillStyle='#fff';ctx.font='bold 72px Tahoma,Arial,sans-serif';
  ctx.fillText('مبروك يا '+CONFIG.girl.nameAr+'! 🎉',0,0);
  ctx.restore();
  const line=(txt,y,col,start,size)=>{
   if(pt<start)return;
   ctx.save();ctx.globalAlpha=fade*Math.min(1,(pt-start)/20);
   ctx.fillStyle=col;ctx.font='bold '+size+'px Tahoma,Arial,sans-serif';
   ctx.fillText(txt,W/2,y+Math.max(0,(start+20-pt))*.8);ctx.restore();
  };
  line('لقد وجدتِ أيمن... وأكملتِ المغامرة كلها ♥',200,'#fde68a',40,34);
  line('أنتِ أجمل شيء حدث في حياتي',247,'#f9a8d4',100,34);
  line('أحبكِ يا '+CONFIG.girl.nameAr+' ♥',290,'#ffffff',160,30);
  ctx.restore();
 }
 // ===== letter (after the celebration) =====
 ctx.font='italic 22px Georgia,serif';
 if(!ENDL){
  ENDL=[];let y=0,tot=0;
  CONFIG.letter.forEach(par=>{wrap(par,620).forEach(t=>{ENDL.push({t,y});y+=30;tot+=t.length});y+=8});
  ENDL.h=y+40;ENDL.tot=tot;
 }
 if(!party){
  ctx.save();ctx.globalAlpha=Math.min(1,(pt-280)/30);
  ctx.fillStyle='rgba(255,244,220,.94)';ctx.strokeStyle='#d9b26a';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect(130,24,700,Math.min(ENDL.h,330),14);ctx.fill();ctx.stroke();
  let rem=Math.max(0,Math.floor((pt-310)/2));
  ctx.fillStyle='#5a3a2a';ctx.font='italic 22px Georgia,serif';
  ENDL.forEach(l=>{if(rem>0){ctx.fillText(l.t.slice(0,rem),165,70+l.y);rem-=l.t.length}});
  ctx.restore();
  // permanent Arabic line
  ctx.save();ctx.direction='rtl';ctx.textAlign='center';
  ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.fillStyle='#f9a8d4';
  ctx.font='bold 26px Tahoma,Arial,sans-serif';
  ctx.fillText('مبروك يا '+CONFIG.girl.nameAr+' ♥ أحبكِ',W/2,H-40);
  ctx.restore();
 }
 ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.textAlign='center';
 ctx.fillText('Hearts collected: '+G.tot+' ♥'+(G.mode==='guest'||pt<600?'':'   ·   Enter — play again'),W/2,H-12);
 ctx.textAlign='left';
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const ph=G.ph;
 if(ph==='menu'||ph==='wait')drawMenuBG();
 else if(ph==='intro')drawIntro();
 else if(ph==='end')drawEnd();
 else if(G.L){
  drawWorld();

/* ---------- Character picture ---------- */
const SIZE=46,SPR=[null,null]; // SIZE = character height in the game (smaller number = smaller characters)
function mip(c,h){
 let cur=c;
 while(cur.height>h*2){const t=document.createElement('canvas');t.width=Math.round(cur.width/2);t.height=Math.round(cur.height/2);const tx=t.getContext('2d');tx.imageSmoothingQuality='high';tx.drawImage(cur,0,0,t.width,t.height);cur=t}
 const o=document.createElement('canvas');o.height=h;o.width=Math.round(c.width*h/c.height);
 const x=o.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cur,0,0,o.width,o.height);return o;
}
function buildSprites(img){
 const sw=800,sh=Math.round(800*img.naturalHeight/img.naturalWidth);
 const c=document.createElement('canvas');c.width=sw;c.height=sh;
 const x=c.getContext('2d');x.drawImage(img,0,0,sw,sh);
 let d;try{d=x.getImageData(0,0,sw,sh)}catch(e){return false}
 const px=d.data,N=sw*sh,bg=[px[0],px[1],px[2]],isBg=new Uint8Array(N),st=[];
 const near=i=>{const o=i*4,a=px[o]-bg[0],b=px[o+1]-bg[1],e=px[o+2]-bg[2];return a*a+b*b+e*e<4900};
 for(let i=0;i<sw;i++)st.push(i,N-sw+i);
 for(let j=0;j<sh;j++)st.push(j*sw,j*sw+sw-1);
 while(st.length){
  const i=st.pop();if(i<0||i>=N||isBg[i]||!near(i))continue;
  isBg[i]=1;const xx=i%sw;if(xx>0)st.push(i-1);if(xx<sw-1)st.push(i+1);st.push(i-sw,i+sw);
 }
 const lab=new Int32Array(N),comps=[];
 for(let s=0;s<N;s++){
  if(isBg[s]||lab[s])continue;
  const id=comps.length+1,q=[s];lab[s]=id;
  let n=0,x0=sw,x1=0,y0=sh,y1=0,sx=0;
  while(q.length){
   const i=q.pop(),xx=i%sw,yy=(i-xx)/sw;n++;sx+=xx;
   if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy;
   if(xx>0&&!isBg[i-1]&&!lab[i-1]){lab[i-1]=id;q.push(i-1)}
   if(xx<sw-1&&!isBg[i+1]&&!lab[i+1]){lab[i+1]=id;q.push(i+1)}
   if(yy>0&&!isBg[i-sw]&&!lab[i-sw]){lab[i-sw]=id;q.push(i-sw)}
   if(yy<sh-1&&!isBg[i+sw]&&!lab[i+sw]){lab[i+sw]=id;q.push(i+sw)}
  }
  comps.push({id,n,x0,x1,y0,y1,cx:sx/n});
 }
 comps.sort((a,b)=>b.n-a.n);
 const two=comps.slice(0,2);if(two.length<2)return false;
 two.sort((a,b)=>a.cx-b.cx);
 two.forEach((k,j)=>{
  const w=k.x1-k.x0+1,h=k.y1-k.y0+1,o=document.createElement('canvas');o.width=w;o.height=h;
  const ox=o.getContext('2d'),od=ox.createImageData(w,h);
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
   const i=(yy+k.y0)*sw+xx+k.x0;
   if(lab[i]===k.id){const a=i*4,b=(yy*w+xx)*4;od.data[b]=px[a];od.data[b+1]=px[a+1];od.data[b+2]=px[a+2];od.data[b+3]=255}
  }
  ox.putImageData(od,0,0);SPR[j]=[mip(o,64),mip(o,150)];
 });
 return true;
}
function tryImg(src,ok,fail){const im=new Image();im.onload=()=>buildSprites(im)?ok():fail();im.onerror=fail;im.src=src}
function needPicker(){$('picker').style.display='block'}
tryImg('characters.png',()=>{},()=>{
 let s=null;try{s=localStorage.getItem('ak_chars')}catch(e){}
 if(s)tryImg(s,()=>{},needPicker);else needPicker();
});
$('pic').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>tryImg(r.result,()=>{try{localStorage.setItem('ak_chars',r.result)}catch(x){}$('picker').style.display='none'},needPicker);
 r.readAsDataURL(f);
};

/* ---------- Loop ---------- */
function tick(){
 fr++;G.pt++;
 if(G.mode!=='guest'){
  if(G.ph==='intro'){const L=CONFIG.intro[G.ii];if(G.pt>L.t.length*2+130)nextLine()}
  else if(G.ph==='play')sim();
  else if(G.ph==='found'){if(G.pt>230)nextLevel()}
 }else if(conn&&conn.open&&fr%2===0){
  conn.send({in:[+!!(K.KeyA||K.ArrowLeft),+!!(K.KeyD||K.ArrowRight),+!!(K.KeyW||K.ArrowUp||K.Space)]});
 }
 introAudio();
 G.P.forEach(p=>{
  if(G.mode==='guest'){
   if(Math.abs(p.x-p.dx)>90||Math.abs(p.y-p.dy)>90){p.dx=p.x;p.dy=p.y}
   else{p.dx+=(p.x-p.dx)*.5;p.dy+=(p.y-p.dy)*.5}
  }else{p.dx=p.x;p.dy=p.y}
 });
 if(G.mode==='host'&&conn&&conn.open&&fr%2===0&&G.ph!=='menu')conn.send(snap());
}
let last=performance.now(),acc=0;
function loop(t){
 acc+=Math.min(100,t-last);last=t;
 while(acc>=16.667){tick();acc-=16.667}
 draw();requestAnimationFrame(loop);
}

/* ---------- Input ---------- */
addEventListener('keydown',e=>{
 const typing=e.target.tagName==='INPUT'||e.target.tagName==='SELECT';
 if(typing&&e.code!=='Enter')return;
 if(typing)return;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault();
 K[e.code]=1;Snd.init();
 if(e.code==='KeyM')Snd.toggle();
 if(G.ph==='menu')return;
 if(e.code==='KeyR'){
  if(G.mode==='guest'){if(conn)conn.send({cmd:'r'})}
  else if(G.ph==='play')restart();
 }
 if(e.code==='Enter'){
  if(G.mode==='guest'){if(conn)conn.send({cmd:'enter'})}else doEnter();
 }
 if(G.mode!=='guest'){
  if(e.code==='Escape'&&G.ph==='intro'){loadLevel(0)}
  if(e.code==='KeyN')jump(1);
  if(e.code==='KeyP')jump(-1);
 }
});
addEventListener('keyup',e=>{K[e.code]=0});
addEventListener('blur',()=>{K={}});
cv.addEventListener('click',()=>{Snd.init();if(G.ph==='intro'&&G.mode!=='guest')doEnter()});

 sel.value=SAVE.max;

 if(q){$('code').value=q.toUpperCase();status('Hi Koutar ♥ press “join a room”')}
})();
requestAnimationFrame(loop);
